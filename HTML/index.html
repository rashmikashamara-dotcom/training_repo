<!DOCTYPE html>
<html>
<head>
    <title>Programming Languages</title>
</head>

<body>

    <h1>Programming Languages</h1>

    <p>Click on any language to learn about it.</p>

    <table border="2" cellpadding="30">

        <tr>
            <td onclick="show('WELCOME TO PYTHON')">Python</td>
            <td onclick="show('WELCOME TO JAVA')">Java</td>
        </tr>

        <tr>
            <td onclick="show('WELCOME TO HTML')">HTML</td>
            <td onclick="show('WELCOME TO CSS')">CSS</td>
        </tr>

    </table>

    <h2 id="result"></h2>

    <script>
        function show(message) {
            document.getElementById("result").innerHTML = message;
        }
    </script>

</body>
</html>
